# nginx site for the static export (npm run export:subdomain → ./out)
# Copy ./out to /var/www/rllogistics on the server, then:
#   sudo cp deploy/nginx-rllogistics.thodalogic.com.conf /etc/nginx/sites-available/rllogistics.thodalogic.com
#   sudo ln -s /etc/nginx/sites-available/rllogistics.thodalogic.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d rllogistics.thodalogic.com      # HTTPS (skip if Cloudflare proxy + Origin cert)

server {
    listen 80;
    listen [::]:80;
    server_name rllogistics.thodalogic.com;

    root /var/www/rllogistics;
    index index.html;

    # Next.js static export uses trailing slashes: /about/ → /about/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Hashed build assets never change — cache for a year.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /opengraph-image {
        default_type image/png;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

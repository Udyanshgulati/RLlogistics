# /etc/nginx/sites-available/schermo.thodalogic.com — proxies to the Coolify-run WordPress on 127.0.0.1:8095.
# certbot --nginx adds the HTTPS server block and the HTTP→HTTPS redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name schermo.thodalogic.com;

    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

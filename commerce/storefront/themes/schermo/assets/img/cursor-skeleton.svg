<svg xmlns="http://www.w3.org/2000/svg" width="40" height="44" viewBox="0 0 40 44">
  <g fill="#f1ebdd" stroke="#0a0a0b" stroke-width="1.3" stroke-linejoin="round">
    <!-- index finger: three phalanges pointing up -->
    <rect x="11.2" y="1.2" width="5" height="7" rx="2.5"/>
    <rect x="11.2" y="9.2" width="5" height="7.4" rx="2.5"/>
    <rect x="11.2" y="17.6" width="5" height="7.6" rx="2.5"/>
    <!-- curled middle, ring and little fingers (two short bones each) -->
    <rect x="17.4" y="18.6" width="4.6" height="5.4" rx="2.3"/>
    <rect x="17.4" y="25" width="4.6" height="4.4" rx="2.2"/>
    <rect x="23" y="19.8" width="4.4" height="5" rx="2.2"/>
    <rect x="23" y="25.8" width="4.4" height="4" rx="2"/>
    <rect x="28.4" y="21.4" width="4" height="4.6" rx="2"/>
    <rect x="28.4" y="27" width="4" height="3.6" rx="1.8"/>
    <!-- thumb -->
    <rect x="4" y="22.4" width="4.6" height="6.4" rx="2.3" transform="rotate(-38 6.3 25.6)"/>
    <rect x="6.6" y="28" width="4.6" height="5.6" rx="2.3" transform="rotate(-38 8.9 30.8)"/>
    <!-- palm: metacarpal bones -->
    <rect x="11.4" y="26.4" width="4.6" height="8.4" rx="2.3"/>
    <rect x="17.4" y="30.4" width="4.4" height="7.2" rx="2.2"/>
    <rect x="23" y="30.8" width="4.2" height="6.6" rx="2.1"/>
    <rect x="28.4" y="31.4" width="3.8" height="5.6" rx="1.9"/>
    <!-- wrist -->
    <path d="M12 36.6 Q21 41.8 31.6 37.6 L31 42.4 Q21 44.6 12.6 41.4 Z"/>
  </g>
  <g fill="#0a0a0b" opacity=".35"><circle cx="13.7" cy="8.6" r=".7"/><circle cx="13.7" cy="17" r=".7"/><circle cx="13.7" cy="25.6" r=".7"/></g>
</svg>
